name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Push dist to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Pages site is stuck on build_type "legacy" with source "main"
      # (raw source = blank page) and GITHUB_TOKEN gets 403 on PUT /pages,
      # so also deploy through the Pages deployments API, which serves the
      # built artifact regardless of the branch setting.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to Pages via Actions API
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
