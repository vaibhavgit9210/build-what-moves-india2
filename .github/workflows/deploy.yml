name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # The old GitHub Pages URL now forwards to https://cyber-sahayata.pages.dev/ .
      # The build still runs because it is the typecheck gate, but the entry point
      # served here is a forwarding page that preserves the query string and hash,
      # so existing deep links like ?e2e=login#/reports/r-2 keep working.
      - name: Replace the entry point with the forwarding page
        run: cp redirect/index.html dist/index.html
      - name: Push dist to gh-pages
        run: |
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The Pages site is stuck on build_type "legacy" with source "main"
      # (raw source = blank page) and GITHUB_TOKEN gets 403 on PUT /pages,
      # so also deploy through the Pages deployments API, which serves the
      # built artifact regardless of the branch setting.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Every push to main also fires a legacy Pages build of raw main, and
      # whichever deployment lands last wins. Wait it out so ours lands last.
      - name: Wait for the legacy Pages build to settle
        run: |
          for i in $(seq 1 60); do
            status=$(curl -s \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status'), d.get('commit'))")
            echo "latest legacy build: ${status}"
            case "$status" in
              built\ ${GITHUB_SHA}|errored\ ${GITHUB_SHA}) exit 0;;
            esac
            sleep 5
          done
          echo "legacy build still pending after 5 min; deploying anyway"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Pages via Actions API
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
