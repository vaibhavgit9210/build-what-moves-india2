name = "sahayata-help"
main = "worker.js"
compatibility_date = "2026-08-01"

# Keyless Workers AI fallback, so the assistant works with zero setup.
[ai]
binding = "AI"

# Optional secret (set with `wrangler secret put GROQ_API_KEY`):
#   GROQ_API_KEY - preferred provider (llama-3.3-70b-versatile); without it
#                  the worker answers from Workers AI (llama-3.1-8b-instruct).
